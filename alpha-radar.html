<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Alpha Radar mobile onboarding · Alva prototypes</title>
<meta name="theme-color" content="#49a3a6">
<link rel="icon" href="assets/logo-portrait2.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/Delight-Regular.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="assets/fonts/Delight-Medium.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="assets/fonts/Delight-SemiBold.ttf" as="font" type="font/ttf" crossorigin>
<!-- Embedded in the prototypes shell? The shell draws the bezel and owns the
     stage chrome, so the page renders as a bare full-screen app. Set before
     the stylesheet loads so no mockup is ever painted. -->
<script>if (window.self !== window.top) document.documentElement.classList.add('embedded');</script>
<link rel="stylesheet" href="alpha-radar.css?v=28">
<link rel="stylesheet" href="device-chrome.css?v=1">
</head>
<body>

<div class="desk">
  <div class="phone" id="phone">
    <div class="phone-buttons" aria-hidden="true">
      <span class="pb pb-action"></span>
      <span class="pb pb-volup"></span>
      <span class="pb pb-voldown"></span>
      <span class="pb pb-power"></span>
    </div>
    <div class="phone-screen">
      <main class="radar-app" id="radarApp">
        <div class="screens" id="screens"></div>

        <div class="system-bar" aria-hidden="true">
          <div class="system-side system-left"><span>9:41</span></div>
          <div class="dynamic-island"></div>
          <div class="system-side system-right">
            <img src="assets/status-signal.svg" alt="">
            <img src="assets/status-wifi.svg" alt="">
            <span class="battery">
              <img class="battery-outline" src="assets/battery-outline.svg" alt="">
              <img class="battery-fill" src="assets/battery-fill.svg" alt="">
              <img class="battery-end" src="assets/battery-end.svg" alt="">
            </span>
          </div>
        </div>

        <header class="flow-topbar" id="flowTopbar">
          <button class="top-back" id="backButton" aria-label="Back">
            <img src="assets/icon-arrow-back.svg" alt="">
          </button>
          <div class="progress" id="progress" aria-label="Onboarding progress"></div>
          <button class="top-skip" id="skipButton">Skip</button>
        </header>

        <div class="home-indicator" aria-hidden="true"><span></span></div>

        <!-- Collection member sheet — a collection card opens this instead of
             toggling. The collection stays atomic: member cards are read-only,
             the only action is the dual-state follow button, which stays in
             sync with the card's checkmark and the selection count behind. -->
        <div class="member-layer" id="memberLayer" aria-hidden="true">
          <button class="member-scrim" data-close-member aria-label="Close"></button>
          <section class="member-sheet" role="dialog" aria-modal="true" aria-labelledby="memberTitle">
            <div class="member-grabber" aria-hidden="true"><span></span></div>
            <header class="member-head">
              <button class="member-close" data-close-member aria-label="Close">
                <img src="assets/close-l1.svg" alt="">
              </button>
              <h2 id="memberTitle"></h2>
            </header>
            <div class="member-scroll" id="memberScroll">
              <p class="member-rule" id="memberRule"></p>
              <div class="source-grid member-grid" id="memberGrid"></div>
            </div>
            <footer class="member-foot">
              <button class="member-follow" id="memberFollow"></button>
            </footer>
          </section>
        </div>

        <!-- Change → selection sheet. Same container grammar as the collection
             sheet: grabber, [✕ | title | qualifier] header, then the list.
             Tapping an option commits and closes; ✕ / scrim / drag / Esc do
             not (14236:48905). -->
        <div class="sheet-layer" id="sheetLayer" aria-hidden="true">
          <button class="sheet-shade" data-close-sheet aria-label="Close"></button>
          <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
            <div class="sheet-grabber" id="sheetGrabber" aria-hidden="true"><span></span></div>
            <header class="sheet-head" id="sheetHead">
              <button class="sheet-close" data-close-sheet aria-label="Close">
                <img src="assets/close-l1.svg" alt="">
              </button>
              <h2 id="sheetTitle"></h2>
              <span class="sheet-meta" id="sheetMeta" hidden></span>
            </header>
            <div class="sheet-options" id="sheetOptions" role="listbox"></div>
          </section>
        </div>

        <div class="toast" id="toast" role="status"></div>
      </main>
    </div>
  </div>

  <nav class="stage-controls stage-controls-left" aria-label="Prototype navigation">
    <a class="stage-pill" href="index.html#/alpha-radar">← All prototypes</a>
  </nav>
  <div class="stage-controls">
    <button class="stage-pill" id="restartButton">Restart</button>
  </div>
</div>

<script src="alpha-radar.js?v=24"></script>
</body>
</html>
